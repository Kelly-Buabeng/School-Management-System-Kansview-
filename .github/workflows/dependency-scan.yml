# Owner: Agent H. Weekly scan for newly published vulnerabilities in dependencies and in the base images,
# even when nobody is pushing code (Monday 03:17 UTC = 03:17 Africa/Accra).
name: dependency-scan

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (all dependencies, report; production high/critical fails)
        run: |
          pnpm audit || true
          pnpm audit --prod --audit-level high
      - name: osv-scanner
        run: |
          curl -fsSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner --lockfile=pnpm-lock.yaml

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - node:22.23.5-alpine3.24
          - caddy:2.11.9-alpine
          - postgres:18.7-trixie
          - clamav/clamav:1.4.6
          - louislam/uptime-kuma:1.23.17
    steps:
      - name: Trivy scan of pinned base/third-party image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
