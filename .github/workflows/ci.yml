# Owner: Agent H. Continuous integration for every pull request and push to main.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  CI: "true"
  SMS_TEST_DB_ADMIN_URL: postgres://sms:sms@localhost:5432/postgres

jobs:
  checks:
    name: contracts, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @sms/shared --filter @sms/contracts --filter @sms/db-types build
      - name: Contract check (operationId + x-permission on every operation)
        run: pnpm --filter @sms/contracts test
      - name: Generated API types are up to date
        run: |
          pnpm contracts:generate
          git diff --exit-code -- packages/contracts/src || { echo "::error::Run pnpm contracts:generate and commit the result"; exit 1; }
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests (api)
        run: pnpm --filter @sms/api test:unit
      - name: Unit tests (shared, web)
        run: pnpm --filter @sms/shared --filter @sms/web test
      - name: Shell scripts (shellcheck)
        run: shellcheck -x -S warning infra/backup/bin/*.sh scripts/*.sh infra/postgres/initdb/*.sh
      - name: Install age (generate-secrets.sh creates the backup encryption key pair)
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - name: Compose files are valid
        run: |
          bash scripts/generate-secrets.sh >/dev/null   # throwaway secrets, only so Compose can resolve the files
          cp infra/.env.example infra/compose/.env
          docker compose -f infra/compose/docker-compose.yml --profile clamav --profile monitoring config -q
          docker compose -f infra/compose/docker-compose.dev.yml config -q
      - name: Caddyfile is valid
        run: docker run --rm -e SMS_DOMAIN=sms.example.test -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile

  integration:
    name: integration (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]   # CR-0001: migrations must run on both; production is 18
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env: { POSTGRES_USER: sms, POSTGRES_PASSWORD: sms, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sms" --health-interval 5s --health-timeout 5s --health-retries 20
          --shm-size 256m
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sms/shared --filter @sms/contracts --filter @sms/db-types build
      - name: Database tests (migrations, guards, audit chain, seed)
        run: pnpm --filter @sms/db test
      - name: RBAC coverage (every route declares a permission matching the spec and matrix)
        run: pnpm --filter @sms/api test:rbac-coverage
      - name: Contract test (Nest routes vs openapi.yaml)
        run: pnpm --filter @sms/api exec vitest run test/contract-routes.int-spec.ts
      - name: API integration tests
        run: pnpm --filter @sms/api test:int

  web:
    name: web build, bundle budget, mock e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sms/shared --filter @sms/contracts build
      - name: Production build
        run: pnpm --filter @sms/web build
      - name: Bundle budget (initial JS <= 250 KB gzip)
        run: node scripts/check-bundle-size.mjs apps/web/dist 250
      - name: Install Playwright browser
        run: pnpm --filter @sms/web exec playwright install --with-deps chromium
      - name: Smoke e2e on mocks
        run: pnpm --filter @sms/web test:e2e

  e2e:
    name: full-stack e2e (CP2-CP4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: sms, POSTGRES_PASSWORD: sms, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sms" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sms/shared --filter @sms/contracts --filter @sms/db-types build
      - run: pnpm --filter @sms/api build
      - run: VITE_API_MODE=real pnpm --filter @sms/web build
      - run: pnpm --filter @sms/web exec playwright install --with-deps chromium
      - name: Typecheck e2e specs
        run: bash scripts/e2e.sh --typecheck
      - name: Playwright (--trace off)
        run: bash scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  ownership:
    name: ownership check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Changed files belong to the branch owner (OWNERSHIP)
        run: bash scripts/check-ownership.sh auto "origin/${{ github.base_ref }}"
        env:
          BRANCH_NAME: ${{ github.head_ref }}

  security:
    name: dependency audit, osv-scanner, gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level high
      - name: osv-scanner
        run: |
          curl -fsSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner --lockfile=pnpm-lock.yaml
      - name: gitleaks (secrets in history)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  images:
    name: build images + Trivy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [checks]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        run: docker buildx build --load -f infra/docker/api.Dockerfile -t kansview/sms-api:ci --build-arg SMS_APP_VERSION=${{ github.sha }} .
      - name: Build web image
        run: docker buildx build --load -f infra/docker/web.Dockerfile -t kansview/sms-web:ci --build-arg SMS_APP_VERSION=${{ github.sha }} .
      - name: Build backup image
        run: docker buildx build --load -f infra/docker/backup.Dockerfile -t kansview/sms-backup:ci .
      - name: Images run as non-root
        run: |
          for i in sms-api sms-web sms-backup; do
            u=$(docker image inspect --format '{{.Config.User}}' kansview/$i:ci); echo "$i user=$u"
            [ -n "$u" ] && [ "$u" != "root" ] && [ "$u" != "0" ] || { echo "::error::$i runs as root"; exit 1; }
          done
      - name: Trivy (HIGH/CRITICAL, fixed vulnerabilities fail the build)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: kansview/sms-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: image, image-ref: kansview/sms-web:ci, severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1", skip-setup-trivy: true }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: image, image-ref: kansview/sms-backup:ci, severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1", skip-setup-trivy: true }
      - name: Trivy config scan (Dockerfiles, Compose)
        uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: config, scan-ref: infra, severity: "HIGH,CRITICAL", exit-code: "1", skip-setup-trivy: true }
