# Owner: Agent H. Production stack for one server (on-premise mini server or cloud VM).
#
#   cd infra/compose
#   cp ../.env.example .env          # then edit SMS_DOMAIN, SMS_TLS, SMS_BACKUP_DIR, RCLONE_REMOTE
#   ../../scripts/generate-secrets.sh  # once: creates infra/secrets/* (never commit them)
#   docker compose up -d --build                       # core services
#   docker compose --profile clamav --profile monitoring up -d   # with virus scanning and Uptime Kuma
#
# Every long-running service restarts automatically after a power cut (restart: unless-stopped) once Docker
# starts at boot (`systemctl enable docker`). See docs/operations/deployment-guide.md.
name: kansview-sms

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging: *logging
  restart: unless-stopped

x-api-env: &api-env
  SMS_NODE_ENV: production
  SMS_SCHOOL_CODE: ${SMS_SCHOOL_CODE:-KSV}
  SMS_TIMEZONE: Africa/Accra
  TZ: Africa/Accra
  SMS_DB_HOST: postgres
  SMS_DB_NAME: sms
  SMS_DB_USER: sms_api
  SMS_DB_PASSWORD_FILE: /run/secrets/db_app_password
  SMS_MASTER_KEY_FILE: /run/secrets/master_key
  SMS_SESSION_SECRET_FILE: /run/secrets/session_key
  SMS_FILE_STORAGE_DIR: /var/lib/sms/storage
  SMS_BACKUP_STATUS_DIR: /var/lib/sms/backup-status
  SMS_CLAMAV_ENABLED: ${SMS_CLAMAV_ENABLED:-true}
  SMS_CLAMAV_HOST: clamav
  SMS_SMS_PROVIDER: ${SMS_SMS_PROVIDER:-mock}
  SMS_LOG_LEVEL: ${SMS_LOG_LEVEL:-info}

services:
  caddy:
    <<: *hardening
    image: ${SMS_IMAGE_PREFIX:-kansview}/sms-web:${SMS_VERSION:-latest}
    build: { context: ../.., dockerfile: infra/docker/web.Dockerfile, args: { SMS_APP_VERSION: "${SMS_VERSION:-dev}" } }
    environment:
      SMS_DOMAIN: ${SMS_DOMAIN:?set SMS_DOMAIN in .env}
      SMS_TLS: ${SMS_TLS:-internal}
      SMS_API_UPSTREAM: api:3000
    ports:
      - "${SMS_HTTP_PORT:-80}:8080"
      - "${SMS_HTTPS_PORT:-443}:8443"
    volumes:
      - caddy_data:/data        # certificates and the LAN certificate authority: keep, it is backed up by the host guide
      - caddy_config:/config
    tmpfs: ["/tmp:size=16m"]
    depends_on:
      api: { condition: service_healthy }
    networks: [frontend, egress]
    mem_limit: 256m

  migrate:
    # One-shot: applies database migrations as the owner role, then exits. The api waits for it.
    image: ${SMS_IMAGE_PREFIX:-kansview}/sms-api:${SMS_VERSION:-latest}
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile, args: { SMS_APP_VERSION: "${SMS_VERSION:-dev}" } }
    command: ["migrate"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging
    restart: "no"
    environment:
      SMS_DB_HOST: postgres
      SMS_DB_NAME: sms
      SMS_DB_USER: sms_owner
      SMS_DB_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  api:
    <<: *hardening
    image: ${SMS_IMAGE_PREFIX:-kansview}/sms-api:${SMS_VERSION:-latest}
    command: ["api"]
    init: true
    environment: *api-env
    secrets: [db_app_password, master_key, session_key]
    volumes:
      - storage:/var/lib/sms/storage
      - ${SMS_BACKUP_DIR:-/srv/sms-backup}/status:/var/lib/sms/backup-status:ro
    tmpfs: ["/tmp:size=256m"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    networks: [frontend, backend]
    mem_limit: 1g
    stop_grace_period: 30s

  worker:
    <<: *hardening
    image: ${SMS_IMAGE_PREFIX:-kansview}/sms-api:${SMS_VERSION:-latest}
    command: ["worker"]
    init: true
    environment: *api-env
    secrets: [db_app_password, master_key, session_key]
    volumes:
      - storage:/var/lib/sms/storage
    tmpfs: ["/tmp:size=256m"]
    healthcheck:
      test: ["CMD", "node", "/app/docker-entrypoint.mjs", "db-check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    networks: [backend, egress]   # egress: SMS provider when the internet is up
    mem_limit: 768m
    stop_grace_period: 60s        # lets running jobs finish; unfinished jobs stay queued in pg-boss

  postgres:
    <<: *hardening
    image: postgres:18.7-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    user: "999:999"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --locale=C.UTF-8"
      SMS_DB_NAME: sms
      TZ: Africa/Accra
    secrets: [db_superuser_password, db_owner_password, db_app_password, db_backup_password]
    volumes:
      - pgdata:/var/lib/postgresql        # PostgreSQL 18 image layout: data in /var/lib/postgresql/18/docker
      - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ../backup/bin/archive-wal.sh:/usr/local/bin/archive-wal.sh:ro
      - ${SMS_BACKUP_DIR:-/srv/sms-backup}:/backups   # second disk: WAL archive is written here
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=0775
      - /tmp:size=64m
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sms -h /var/run/postgresql"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [backend]
    mem_limit: 3g
    stop_grace_period: 120s       # clean shutdown (checkpoint) before Docker kills it

  backup:
    <<: *hardening
    image: ${SMS_IMAGE_PREFIX:-kansview}/sms-backup:${SMS_VERSION:-latest}
    build: { context: ../.., dockerfile: infra/docker/backup.Dockerfile }
    # Root inside the container only to read uploaded files written by the api user and to prune WAL written by
    # postgres; every other capability is dropped and the root filesystem is read-only.
    user: "0:0"
    cap_add: [DAC_READ_SEARCH, DAC_OVERRIDE, FOWNER, CHOWN]
    environment:
      TZ: Africa/Accra
      BACKUP_TIME: ${SMS_BACKUP_TIME:-01:30}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG: /run/secrets/rclone_conf
      RCLONE_CACHE_DIR: /tmp/rclone
      HOME: /tmp
      BACKUP_PUSH_URL_FILE: /run/secrets/backup_push_url
      OFFSITE_PUSH_URL_FILE: /run/secrets/offsite_push_url
      DISK_PUSH_URL_FILE: /run/secrets/disk_push_url
      DISK_MIN_FREE_PERCENT: ${SMS_DISK_MIN_FREE_PERCENT:-15}
    secrets: [db_backup_password, backup_age_recipients, rclone_conf, backup_push_url, offsite_push_url, disk_push_url]
    volumes:
      - ${SMS_BACKUP_DIR:-/srv/sms-backup}:/backups
      - storage:/data/storage:ro
    tmpfs: ["/tmp:size=256m"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend, egress]   # egress: off-site storage
    mem_limit: 512m
    stop_grace_period: 30s

  clamav:
    profiles: [clamav]
    image: clamav/clamav:1.4.6@sha256:4cc4350d3fded380caf1799e76c0d1c93f3fa40af99c0cb2862ec0c9b117718a
    # The ClamAV image needs a writable root (freshclam runtime files) and starts as root to drop to clamav.
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    networks: [backend, egress]   # egress: virus definition updates
    mem_limit: 2g

  uptime-kuma:
    profiles: [monitoring]
    image: louislam/uptime-kuma:1.23.17@sha256:70233f4acb5163fd2a59a49909cf01e44415cecff13dba69e3a86647a2919f83
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped
    volumes:
      - uptime_kuma:/app/data
    ports:
      - "${SMS_KUMA_BIND:-127.0.0.1}:3001:3001"   # reach it with an SSH tunnel, or set SMS_KUMA_BIND to the LAN IP
    networks: [frontend, egress]
    mem_limit: 384m

networks:
  frontend: {}
  backend: { internal: true }     # database, api, worker, clamav: no internet
  egress: {}

volumes:
  pgdata: {}
  storage: {}
  caddy_data: {}
  caddy_config: {}
  clamav_db: {}
  uptime_kuma: {}

secrets:
  db_superuser_password: { file: ../secrets/db_superuser_password }
  db_owner_password: { file: ../secrets/db_owner_password }
  db_app_password: { file: ../secrets/db_app_password }
  db_backup_password: { file: ../secrets/db_backup_password }
  master_key: { file: ../secrets/master_key }
  session_key: { file: ../secrets/session_key }
  backup_age_recipients: { file: ../secrets/backup_age_recipients }
  rclone_conf: { file: ../secrets/rclone.conf }
  backup_push_url: { file: ../secrets/backup_push_url }
  offsite_push_url: { file: ../secrets/offsite_push_url }
  disk_push_url: { file: ../secrets/disk_push_url }
