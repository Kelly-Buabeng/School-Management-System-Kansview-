# Owner: Agent H. PostgreSQL 18 settings for the Kansview SMS on one server with 8 GB RAM, SSD.
# Memory budget (8 GB host): postgres ~3 GB (2 GB shared_buffers + work memory), api+worker ~1 GB,
# ClamAV ~1.5 GB, Caddy/backup/OS cache the rest. On a 4 GB host: shared_buffers=1GB, effective_cache_size=2GB,
# and run without the clamav profile.

listen_addresses = '*'
port = 5432
max_connections = 60                 # api pool 20 + worker 10 + backup/migrate/admin headroom
superuser_reserved_connections = 3
password_encryption = scram-sha-256
timezone = 'Africa/Accra'
log_timezone = 'Africa/Accra'
datestyle = 'iso, dmy'
lc_messages = 'C.UTF-8'

# ---------- memory ----------
shared_buffers = 2GB
effective_cache_size = 5GB
work_mem = 16MB
maintenance_work_mem = 512MB
huge_pages = try
dynamic_shared_memory_type = posix

# ---------- durability: NEVER turn these off (payments must survive a power cut) ----------
fsync = on
synchronous_commit = on
full_page_writes = on
wal_sync_method = fdatasync
# Data checksums are enabled by initdb by default in PostgreSQL 18 (detect silent disk corruption).

# ---------- WAL and archiving (point-in-time recovery, RPO 15 min target) ----------
wal_level = replica
wal_compression = zstd
wal_log_hints = on
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
archive_mode = on
# Copies each finished 16 MB WAL segment (gzip, then age-encrypted) to the backup disk mounted at /backups.
# Script: infra/backup/bin/archive-wal.sh. Needs the age public key (WAL_AGE_RECIPIENTS_FILE).
archive_command = '/usr/local/bin/archive-wal.sh "%p" "%f"'
# Force a segment switch at least every 5 minutes so a quiet database still archives recent changes.
archive_timeout = 300
max_wal_senders = 4                  # pg_basebackup -X stream uses 2
wal_keep_size = 512MB

# ---------- planner (SSD) ----------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ---------- safety nets ----------
idle_in_transaction_session_timeout = '10min'
lock_timeout = 0
deadlock_timeout = 1s

# ---------- autovacuum ----------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# ---------- logging (stderr -> docker json log, rotated by Docker) ----------
logging_collector = off
log_destination = 'stderr'
log_min_duration_statement = 500ms   # matches the p95 < 500 ms target; slow queries show up in logs
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1s
log_line_prefix = '%m [%p] %q%u@%d '
log_statement = 'ddl'
