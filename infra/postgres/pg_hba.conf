# Owner: Agent H. Who may connect to PostgreSQL, and how. First match wins.
# TYPE  DATABASE        USER            ADDRESS         METHOD
# Inside the container (docker exec ... psql): the postgres OS user only.
local   all             postgres                        peer
local   all             all                             scram-sha-256
# Application and migration roles from the private Docker network only.
host    sms             sms_owner,sms_app,sms_readonly  samenet         scram-sha-256
# Base backups (pg_basebackup) from the backup container.
host    replication     sms_backup      samenet         scram-sha-256
host    sms             sms_backup      samenet         scram-sha-256
# Everything else is refused.
host    all             all             all             reject
