openapi: 3.1.0
info:
  title: Kansview School Management System API
  version: 1.0.0-phase0
  description: |
    Back-office API for the school administrator, bursar, headteacher, registrar (and optional teacher role).
    STATUS: Phase 0 contract, proposed. Frozen on approval; changes only through a change request.

    Conventions (see docs/contracts/conventions.md):
    - Money is integer pesewas (`*Pesewas`). Dates `YYYY-MM-DD`. Instants ISO 8601 UTC; display Africa/Accra.
    - Every operation declares `x-permission` (see docs/contracts/rbac.md). No declaration = CI failure.
    - `x-audit` marks operations that always write an audit event.
    - `x-idempotent: true` operations REQUIRE the Idempotency-Key header.
    - Errors are application/problem+json (Problem schema).
    - Request bodies are strict: unknown properties are rejected.
    Detailed request/response schemas for every operation are completed by the owning agent during Phase 1
    as an additive change (new optional fields only); paths, methods, permissions and core schemas below are frozen.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - {name: auth}
  - {name: users}
  - {name: settings}
  - {name: academic-setup}
  - {name: students}
  - {name: guardians}
  - {name: emergency}
  - {name: enrolment}
  - {name: promotion}
  - {name: withdrawals}
  - {name: staff}
  - {name: attendance}
  - {name: academics}
  - {name: welfare}
  - {name: finance}
  - {name: reports}
  - {name: messages}
  - {name: imports}
  - {name: dashboard}
  - {name: search}
  - {name: files}
  - {name: audit}
  - {name: data-protection}
  - {name: system}

paths:
  # ---------------- AUTH (Agent D) ----------------
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      x-permission: public
      x-audit: login
      summary: Username + password. Returns mfaRequired if TOTP is enabled or mandatory.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses:
        '200': {description: Signed in or MFA step needed, content: {application/json: {schema: {$ref: '#/components/schemas/LoginResponse'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '423': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /auth/mfa/verify:
    post: {tags: [auth], operationId: verifyMfa, security: [], x-permission: mfa-pending-session, x-audit: login, summary: Submit TOTP or recovery code, responses: {'200': {$ref: '#/components/responses/Me'}, '401': {$ref: '#/components/responses/Problem'}}}
  /auth/mfa/setup:
    post: {tags: [auth], operationId: startMfaSetup, x-permission: self, summary: Returns otpauth URI + QR for enrolment, responses: {'200': {description: OK}}}
  /auth/mfa/enable:
    post: {tags: [auth], operationId: enableMfa, x-permission: self, x-audit: update, summary: Confirm first TOTP code; returns one-time recovery codes, responses: {'200': {description: OK}}}
  /auth/mfa/disable:
    post: {tags: [auth], operationId: disableMfa, x-permission: self, x-audit: update, summary: Not allowed for ADMIN/BURSAR, responses: {'204': {description: OK}, '422': {$ref: '#/components/responses/Problem'}}}
  /auth/logout:
    post: {tags: [auth], operationId: logout, x-permission: self, responses: {'204': {description: Signed out}}}
  /auth/me:
    get: {tags: [auth], operationId: getMe, x-permission: self, summary: Current user, roles, effective permissions, CSRF token, responses: {'200': {$ref: '#/components/responses/Me'}}}
  /auth/password/change:
    post: {tags: [auth], operationId: changePassword, x-permission: self, x-audit: update, responses: {'204': {description: Changed; other sessions revoked}}}
  /auth/password/reset-request:
    post: {tags: [auth], operationId: requestPasswordReset, security: [], x-permission: public, summary: Always 202 (no account enumeration), responses: {'202': {description: Accepted}}}
  /auth/password/reset:
    post: {tags: [auth], operationId: resetPassword, security: [], x-permission: public, x-audit: update, responses: {'204': {description: Reset}, '400': {$ref: '#/components/responses/Problem'}}}

  # ---------------- USERS (Agent D) ----------------
  /users:
    get: {tags: [users], operationId: listUsers, x-permission: 'users:read', responses: {'200': {description: Page of users}}}
    post: {tags: [users], operationId: createUser, x-permission: 'users:create', x-audit: create, responses: {'201': {description: Created with temporary password, must change at first login}}}
  /users/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [users], operationId: getUser, x-permission: 'users:read', responses: {'200': {description: OK}}}
    patch: {tags: [users], operationId: updateUser, x-permission: 'users:update', x-audit: update, summary: Roles, status, name, responses: {'200': {description: OK}}}
  /users/{id}/force-logout:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [users], operationId: forceLogoutUser, x-permission: 'users:update', x-audit: update, responses: {'204': {description: All sessions revoked}}}
  /users/{id}/unlock:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [users], operationId: unlockUser, x-permission: 'users:update', x-audit: update, responses: {'204': {description: OK}}}
  /users/{id}/reset-mfa:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [users], operationId: resetUserMfa, x-permission: 'users:update', x-audit: update, responses: {'204': {description: OK}}}
  /users/{id}/reset-password:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [users], operationId: adminResetPassword, x-permission: 'users:update', x-audit: update, responses: {'200': {description: One-time temporary password}}}

  # ---------------- SETTINGS & ACADEMIC SETUP (Agent B) ----------------
  /settings/school:
    get: {tags: [settings], operationId: getSchoolProfile, x-permission: 'settings:read', responses: {'200': {description: OK}}}
    patch: {tags: [settings], operationId: updateSchoolProfile, x-permission: 'settings:update', x-audit: update, responses: {'200': {description: OK}}}
  /settings/school/logo:
    put: {tags: [settings], operationId: uploadLogo, x-permission: 'settings:update', x-audit: update, requestBody: {content: {multipart/form-data: {schema: {type: object, properties: {file: {type: string, format: binary}}}}}}, responses: {'200': {description: OK}}}
  /settings/policies:
    get: {tags: [settings], operationId: getPolicies, x-permission: 'settings:read', responses: {'200': {description: All policy switches}}}
    patch: {tags: [settings], operationId: updatePolicies, x-permission: 'settings:update', x-audit: update, responses: {'200': {description: OK}}}
  /academic-years:
    get: {tags: [academic-setup], operationId: listAcademicYears, x-permission: 'academic_setup:read', responses: {'200': {description: OK}}}
    post: {tags: [academic-setup], operationId: createAcademicYear, x-permission: 'academic_setup:create', x-audit: create, summary: Creates year with its 3 terms, responses: {'201': {description: Created}}}
  /academic-years/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    patch: {tags: [academic-setup], operationId: updateAcademicYear, x-permission: 'academic_setup:update', x-audit: update, responses: {'200': {description: OK}}}
  /academic-years/{id}/set-current:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [academic-setup], operationId: setCurrentAcademicYear, x-permission: 'academic_setup:update', x-audit: update, responses: {'200': {description: OK}}}
  /terms/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    patch: {tags: [academic-setup], operationId: updateTerm, x-permission: 'academic_setup:update', x-audit: update, responses: {'200': {description: OK}}}
  /levels:
    get: {tags: [academic-setup], operationId: listLevels, x-permission: 'academic_setup:read', responses: {'200': {description: OK}}}
    post: {tags: [academic-setup], operationId: createLevel, x-permission: 'academic_setup:create', x-audit: create, responses: {'201': {description: Created}}}
  /levels/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    patch: {tags: [academic-setup], operationId: updateLevel, x-permission: 'academic_setup:update', x-audit: update, responses: {'200': {description: OK}}}
  /classes:
    get: {tags: [academic-setup], operationId: listClasses, x-permission: 'academic_setup:read', parameters: [{name: academicYearId, in: query, schema: {type: string, format: uuid}}], responses: {'200': {description: OK, includes enrolled count and capacity}}}
    post: {tags: [academic-setup], operationId: createClass, x-permission: 'academic_setup:create', x-audit: create, responses: {'201': {description: Created}}}
  /classes/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [academic-setup], operationId: getClass, x-permission: 'academic_setup:read', responses: {'200': {description: OK}}}
    patch: {tags: [academic-setup], operationId: updateClass, x-permission: 'academic_setup:update', x-audit: update, summary: Capacity, stream, class teacher, responses: {'200': {description: OK}}}
  /classes/{id}/students:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [enrolment], operationId: listClassStudents, x-permission: 'enrolments:read', responses: {'200': {description: Current roll with roll numbers}}}
  /classes/{id}/roll-numbers:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [enrolment], operationId: renumberClassRoll, x-permission: 'enrolments:update', x-audit: update, summary: Re-assign roll numbers (alphabetical or manual), responses: {'200': {description: OK}}}
  /subjects:
    get: {tags: [academic-setup], operationId: listSubjects, x-permission: 'academic_setup:read', responses: {'200': {description: OK}}}
    post: {tags: [academic-setup], operationId: createSubject, x-permission: 'academic_setup:create', x-audit: create, responses: {'201': {description: Created}}}
  /subjects/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    patch: {tags: [academic-setup], operationId: updateSubject, x-permission: 'academic_setup:update', x-audit: update, responses: {'200': {description: OK}}}
  /levels/{id}/subjects:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put: {tags: [academic-setup], operationId: setLevelSubjects, x-permission: 'academic_setup:update', x-audit: update, responses: {'200': {description: OK}}}
  /grading-scales:
    get: {tags: [academic-setup], operationId: listGradingScales, x-permission: 'academic_setup:read', responses: {'200': {description: OK}}}
    post: {tags: [academic-setup], operationId: createGradingScale, x-permission: 'settings:update', x-audit: create, responses: {'201': {description: Created}}}
  /grading-scales/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put: {tags: [academic-setup], operationId: replaceGradingScale, x-permission: 'settings:update', x-audit: update, responses: {'200': {description: OK}}}

  # ---------------- STUDENTS (Agent B) ----------------
  /students:
    get:
      tags: [students]
      operationId: listStudents
      x-permission: 'students:read'
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: q, in: query, schema: {type: string}}
        - {name: classId, in: query, schema: {type: string, format: uuid}}
        - {name: levelId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/StudentStatus'}}
      responses: {'200': {description: Page of StudentSummary}}
    post:
      tags: [students]
      operationId: admitStudent
      x-permission: 'students:create'
      x-audit: create
      summary: |
        Admit a student. Atomically: generates the permanent studentCode, creates the first enrolment,
        links/creates guardians, optional medical record and emergency contacts.
        Returns 409 STUDENT_POSSIBLE_DUPLICATE unless `confirmNotDuplicate: true` with a reason.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdmitStudentRequest'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Student'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /students/duplicate-check:
    post: {tags: [students], operationId: checkStudentDuplicate, x-permission: 'students:create', summary: 'Same name (fuzzy) + DOB + guardian phone -> candidates', responses: {'200': {description: List of possible matches}}}
  /students/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [students], operationId: getStudent, x-permission: 'students:read', x-audit: view, responses: {'200': {description: Student (fields filtered by role), content: {application/json: {schema: {$ref: '#/components/schemas/Student'}}}}, '404': {$ref: '#/components/responses/Problem'}}}
    patch: {tags: [students], operationId: updateStudent, x-permission: 'students:update', x-audit: update, parameters: [{$ref: '#/components/parameters/IfMatch'}], summary: studentCode is never editable, responses: {'200': {description: OK}, '412': {$ref: '#/components/responses/Problem'}}}
  /students/{id}/archive:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [students], operationId: archiveStudent, x-permission: 'students:archive', x-audit: archive, summary: Soft delete with reason (e.g. admission entered by mistake), responses: {'204': {description: OK}}}
  /students/{id}/photo:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put: {tags: [students], operationId: uploadStudentPhoto, x-permission: 'students:update', x-audit: update, requestBody: {content: {multipart/form-data: {schema: {type: object, properties: {file: {type: string, format: binary}}}}}}, responses: {'200': {description: OK}}}
  /students/{id}/medical:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [students], operationId: getStudentMedical, x-permission: 'medical:read', x-audit: view, responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/StudentMedical'}}}}}}
    put: {tags: [students], operationId: putStudentMedical, x-permission: 'medical:update', x-audit: update, responses: {'200': {description: OK}}}
  /students/{id}/documents:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [students], operationId: listStudentDocuments, x-permission: 'student_documents:read', responses: {'200': {description: OK}}}
    post: {tags: [students], operationId: uploadStudentDocument, x-permission: 'student_documents:create', x-audit: create, summary: 'PDF/JPEG/PNG only, max 5 MB, scanned before available', requestBody: {content: {multipart/form-data: {schema: {type: object, required: [file, docType], properties: {file: {type: string, format: binary}, docType: {type: string, enum: [birth_certificate, previous_report, passport_photo, other]}, notes: {type: string, maxLength: 500}}}}}}, responses: {'201': {description: Accepted, scanStatus pending}, '415': {$ref: '#/components/responses/Problem'}, '413': {$ref: '#/components/responses/Problem'}}}
  /students/{id}/documents/{documentId}/archive:
    parameters: [{$ref: '#/components/parameters/Id'}, {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}]
    post: {tags: [students], operationId: archiveStudentDocument, x-permission: 'student_documents:archive', x-audit: archive, responses: {'204': {description: OK}}}
  /students/{id}/guardians:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [guardians], operationId: listStudentGuardians, x-permission: 'guardians:read', responses: {'200': {description: OK}}}
    post: {tags: [guardians], operationId: linkGuardian, x-permission: 'guardians:update', x-audit: update, summary: Link existing guardianId or create new, with relationship flags, responses: {'201': {description: Linked}}}
  /students/{id}/guardians/{guardianId}:
    parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/GuardianId'}]
    patch: {tags: [guardians], operationId: updateGuardianLink, x-permission: 'guardians:update', x-audit: update, summary: relationship, isPrimary, isFeePayer, canPickUp, receivesSms, responses: {'200': {description: OK}}}
    delete: {tags: [guardians], operationId: unlinkGuardian, x-permission: 'guardians:update', x-audit: update, summary: Removes the link only (guardian record kept), responses: {'204': {description: OK}}}
  /students/{id}/siblings:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [students], operationId: listSiblings, x-permission: 'students:read', summary: Derived from shared guardians, responses: {'200': {description: OK}}}
  /students/{id}/status-history:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [students], operationId: getStudentStatusHistory, x-permission: 'students:read', responses: {'200': {description: OK}}}

  # ---------------- EMERGENCY (Agent B) ----------------
  /students/{id}/emergency-view:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [emergency], operationId: getEmergencyView, x-permission: 'emergency_view:read', x-audit: emergency_view, summary: 'Photo, class, medical alert summary, allergies, ordered contacts with tel: links, pickups, recent contact log', responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/EmergencyView'}}}}}}
  /students/{id}/emergency-contacts:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [emergency], operationId: listEmergencyContacts, x-permission: 'students:read', responses: {'200': {description: OK}}}
    put: {tags: [emergency], operationId: replaceEmergencyContacts, x-permission: 'students:update', x-audit: update, summary: Replace the ordered list in one transaction, responses: {'200': {description: OK}}}
  /students/{id}/emergency-contact-logs:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [emergency], operationId: listEmergencyContactLogs, x-permission: 'emergency_log:read', responses: {'200': {description: OK}}}
    post: {tags: [emergency], operationId: logEmergencyContact, x-permission: 'emergency_log:create', responses: {'201': {description: Logged}}}
  /students/{id}/pickups:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [emergency], operationId: listPickups, x-permission: 'pickups:read', responses: {'200': {description: OK}}}
    post: {tags: [emergency], operationId: addPickup, x-permission: 'pickups:create', x-audit: create, responses: {'201': {description: Created}}}
  /students/{id}/pickups/{pickupId}:
    parameters: [{$ref: '#/components/parameters/Id'}, {name: pickupId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch: {tags: [emergency], operationId: updatePickup, x-permission: 'pickups:update', x-audit: update, responses: {'200': {description: OK}}}
    delete: {tags: [emergency], operationId: archivePickup, x-permission: 'pickups:archive', x-audit: archive, responses: {'204': {description: OK}}}

  # ---------------- GUARDIANS (Agent B; Ghana Card reveal enforced by D) ----------------
  /guardians:
    get: {tags: [guardians], operationId: listGuardians, x-permission: 'guardians:read', parameters: [{name: q, in: query, schema: {type: string}}, {name: phone, in: query, schema: {type: string}}], responses: {'200': {description: OK}}}
    post: {tags: [guardians], operationId: createGuardian, x-permission: 'guardians:create', x-audit: create, responses: {'201': {description: Created}}}
  /guardians/{guardianId}:
    parameters: [{$ref: '#/components/parameters/GuardianId'}]
    get: {tags: [guardians], operationId: getGuardian, x-permission: 'guardians:read', x-audit: view, responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Guardian'}}}}}}
    patch: {tags: [guardians], operationId: updateGuardian, x-permission: 'guardians:update', x-audit: update, parameters: [{$ref: '#/components/parameters/IfMatch'}], responses: {'200': {description: OK}}}
  /guardians/{guardianId}/students:
    parameters: [{$ref: '#/components/parameters/GuardianId'}]
    get: {tags: [guardians], operationId: listGuardianStudents, x-permission: 'guardians:read', responses: {'200': {description: OK}}}
  /guardians/{guardianId}/ghana-card/reveal:
    parameters: [{$ref: '#/components/parameters/GuardianId'}]
    post: {tags: [guardians], operationId: revealGuardianGhanaCard, x-permission: 'ghana_card:reveal', x-audit: reveal_sensitive, summary: Reason required, responses: {'200': {description: Full number}}}
  /guardians/merge:
    post: {tags: [guardians], operationId: mergeGuardians, x-permission: 'guardians:update', x-audit: update, summary: Merge duplicate guardian records (keeps both rows; loser archived and redirected), responses: {'200': {description: OK}}}

  # ---------------- ENROLMENT & PROMOTION (Agent B) ----------------
  /students/{id}/enrolments:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [enrolment], operationId: listStudentEnrolments, x-permission: 'enrolments:read', responses: {'200': {description: Full dated history}}}
  /students/{id}/change-class:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [enrolment], operationId: changeClass, x-permission: 'enrolments:update', x-audit: update, summary: Closes current enrolment and opens a new one (e.g. stream change); capacity checked, responses: {'201': {description: OK}, '422': {$ref: '#/components/responses/Problem'}}}
  /promotion-runs:
    get: {tags: [promotion], operationId: listPromotionRuns, x-permission: 'promotion:read', responses: {'200': {description: OK}}}
    post: {tags: [promotion], operationId: createPromotionRun, x-permission: 'promotion:create', x-audit: create, summary: Build a draft preview for chosen classes into the target year, with arrears flags per policy, responses: {'201': {description: Draft run with items, content: {application/json: {schema: {$ref: '#/components/schemas/PromotionRun'}}}}}}
  /promotion-runs/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [promotion], operationId: getPromotionRun, x-permission: 'promotion:read', responses: {'200': {description: OK}}}
  /promotion-runs/{id}/items/{itemId}:
    parameters: [{$ref: '#/components/parameters/Id'}, {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch: {tags: [promotion], operationId: updatePromotionItem, x-permission: 'promotion:update', summary: Set exception action (repeat/skip/withdraw/transfer_out/graduate), target class, override reason, responses: {'200': {description: OK}}}
  /promotion-runs/{id}/commit:
    parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post: {tags: [promotion], operationId: commitPromotionRun, x-permission: 'promotion:commit', x-audit: update, x-idempotent: true, summary: Applies all items in one transaction; blocked items (policy=block) must have override reasons, responses: {'200': {description: Committed}, '422': {$ref: '#/components/responses/Problem'}}}
  /promotion-runs/{id}/undo:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [promotion], operationId: undoPromotionRun, x-permission: 'promotion:undo', x-audit: update, summary: Only within undoDeadline and if no dependent records; reason required, responses: {'200': {description: Undone}, '422': {$ref: '#/components/responses/Problem'}}}

  # ---------------- WITHDRAWALS (Agent B; letter PDF by F) ----------------
  /students/{id}/withdrawals:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [withdrawals], operationId: startWithdrawal, x-permission: 'withdrawals:create', x-audit: create, responses: {'201': {description: Pending clearance, includes fee balance from finance}}}
  /withdrawals:
    get: {tags: [withdrawals], operationId: listWithdrawals, x-permission: 'withdrawals:read', responses: {'200': {description: OK}}}
  /withdrawals/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [withdrawals], operationId: getWithdrawal, x-permission: 'withdrawals:read', responses: {'200': {description: OK}}}
  /withdrawals/{id}/clearance/{item}:
    parameters: [{$ref: '#/components/parameters/Id'}, {name: item, in: path, required: true, schema: {type: string, enum: [fees, books, uniform, property, library]}}]
    put: {tags: [withdrawals], operationId: setClearanceItem, x-permission: 'withdrawals:update', x-audit: update, summary: fees item requires BURSAR or ADMIN, responses: {'200': {description: OK}}}
  /withdrawals/{id}/complete:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [withdrawals], operationId: completeWithdrawal, x-permission: 'withdrawals:complete', x-audit: update, responses: {'200': {description: Student status changed, enrolment closed}}}
  /withdrawals/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [withdrawals], operationId: cancelWithdrawal, x-permission: 'withdrawals:update', x-audit: update, responses: {'200': {description: OK}}}
  /withdrawals/{id}/transfer-letter.pdf:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [withdrawals], operationId: getTransferLetter, x-permission: 'withdrawals:export', x-audit: export, responses: {'200': {description: PDF, content: {application/pdf: {}}}}}

  # ---------------- STAFF (Agent B) ----------------
  /staff:
    get: {tags: [staff], operationId: listStaff, x-permission: 'staff:read', responses: {'200': {description: OK}}}
