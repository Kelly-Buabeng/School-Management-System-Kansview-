  /imports/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [imports], operationId: getImport, x-permission: 'imports:read', responses: {'200': {description: Status and totals (valid, warnings, errors, duplicates)}}}
  /imports/{id}/validate:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [imports], operationId: validateImport, x-permission: 'imports:create', summary: Dry run; nothing written outside staging, responses: {'202': {description: Job accepted}}}
  /imports/{id}/rows:
    parameters: [{$ref: '#/components/parameters/Id'}, {name: status, in: query, schema: {type: string, enum: [valid, warning, error, duplicate]}}, {$ref: '#/components/parameters/Page'}]
    get: {tags: [imports], operationId: listImportRows, x-permission: 'imports:read', responses: {'200': {description: Preview rows with messages}}}
  /imports/{id}/rows/{rowNumber}:
    parameters: [{$ref: '#/components/parameters/Id'}, {name: rowNumber, in: path, required: true, schema: {type: integer}}]
    patch: {tags: [imports], operationId: resolveImportRow, x-permission: 'imports:create', summary: 'Mark duplicate as "link to existing", "create new" or "skip"', responses: {'200': {description: OK}}}
  /imports/{id}/error-report.xlsx:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [imports], operationId: downloadImportErrorReport, x-permission: 'imports:read', responses: {'200': {description: Original rows plus an Errors column}}}
  /imports/{id}/commit:
    parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post: {tags: [imports], operationId: commitImport, x-permission: 'imports:commit', x-audit: create, x-idempotent: true, summary: Only valid/resolved rows; batched; resumable, responses: {'202': {description: Job accepted}}}

  # ---------------- DASHBOARD & SEARCH (Agent B; finance widgets call C services) ----------------
  /dashboard:
    get: {tags: [dashboard], operationId: getDashboard, x-permission: 'dashboard:read', summary: 'Widgets filtered by role: enrolment by class, collection vs target, arrears, attendance trend, birthdays (next 14 days)', responses: {'200': {description: OK}}}
  /search:
    get: {tags: [search], operationId: globalSearch, x-permission: 'search:read', parameters: [{name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 100}}, {name: limit, in: query, schema: {type: integer, maximum: 20, default: 10}}], summary: 'Students by name/code/class, guardians by name/phone, staff by name, receipts by number. Target p95 < 300 ms.', responses: {'200': {description: Grouped results, content: {application/json: {schema: {$ref: '#/components/schemas/SearchResults'}}}}}}

  # ---------------- FILES (Agent F store, D pipeline) ----------------
  /files/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [files], operationId: downloadFile, x-permission: inherits-from-owning-record, x-audit: view, summary: 'Served with Content-Disposition: attachment, nosniff; only scanStatus=clean', responses: {'200': {description: File}, '404': {$ref: '#/components/responses/Problem'}}}

  # ---------------- AUDIT & DATA PROTECTION (Agent D) ----------------
  /audit-events:
    get: {tags: [audit], operationId: listAuditEvents, x-permission: 'audit:read', parameters: [{name: actorUserId, in: query, schema: {type: string, format: uuid}}, {name: studentId, in: query, schema: {type: string, format: uuid}}, {name: action, in: query, schema: {type: string}}, {name: from, in: query, schema: {type: string, format: date-time}}, {name: to, in: query, schema: {type: string, format: date-time}}, {$ref: '#/components/parameters/Page'}], responses: {'200': {description: OK}}}
  /audit-events/verify:
    post: {tags: [audit], operationId: verifyAuditChain, x-permission: 'audit:read', responses: {'200': {description: Chain intact or first broken event id}}}
  /data-subject-requests:
    get: {tags: [data-protection], operationId: listDataSubjectRequests, x-permission: 'dpa:read', responses: {'200': {description: OK}}}
    post: {tags: [data-protection], operationId: createDataSubjectRequest, x-permission: 'dpa:create', x-audit: create, responses: {'201': {description: Logged with due date}}}
  /data-subject-requests/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    patch: {tags: [data-protection], operationId: updateDataSubjectRequest, x-permission: 'dpa:update', x-audit: update, responses: {'200': {description: OK}}}
  /students/{id}/subject-access-export:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [data-protection], operationId: exportStudentData, x-permission: 'dpa:export', x-audit: export, summary: 'Full data pack (PDF + JSON) for a subject access request', responses: {'202': {description: Export job}}}
  /retention/candidates:
    get: {tags: [data-protection], operationId: listRetentionCandidates, x-permission: 'dpa:read', summary: Records past their retention period, responses: {'200': {description: OK}}}
  /students/{id}/anonymise:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post: {tags: [data-protection], operationId: anonymiseStudent, x-permission: 'dpa:anonymise', x-audit: update, summary: 'Replaces personal fields; keeps studentCode and financial totals for statutory retention; irreversible, needs typed confirmation', responses: {'200': {description: OK}}}

  # ---------------- SYSTEM (Agent H) ----------------
  /health/live:
    get: {tags: [system], operationId: healthLive, security: [], x-permission: public, responses: {'200': {description: Process up}}}
  /health/ready:
    get: {tags: [system], operationId: healthReady, security: [], x-permission: public, summary: 'DB reachable, migrations current, queue running (no details leaked)', responses: {'200': {description: Ready}, '503': {description: Not ready}}}
  /system/status:
    get: {tags: [system], operationId: systemStatus, x-permission: 'system:read', summary: 'Last backup time and result, disk space, queue backlog, SMS provider status, version', responses: {'200': {description: OK}}}

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-sms_session
      description: HttpOnly, Secure, SameSite=Strict. State-changing requests also need header X-CSRF-Token (from /auth/me).
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    GuardianId: {name: guardianId, in: path, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}, description: Record version for optimistic locking}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
    Format: {name: format, in: query, schema: {type: string, enum: [json, xlsx, pdf], default: json}}
  responses:
    Problem:
      description: Error
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Me:
      description: Current user
      content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string, examples: [PAYMENT_DUPLICATE_REFERENCE]}
        detail: {type: string}
        requestId: {type: string}
        errors:
          type: array
          items: {type: object, required: [field, code, message], properties: {field: {type: string}, code: {type: string}, message: {type: string}}}
        meta: {type: object, additionalProperties: true}
    Pesewas: {type: integer, format: int64, description: Integer amount in pesewas (GH₵1 = 100)}
    Role: {type: string, enum: [ADMIN, BURSAR, HEADTEACHER, REGISTRAR, TEACHER]}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties: {username: {type: string, maxLength: 100}, password: {type: string, maxLength: 256}}
    LoginResponse:
      type: object
      properties:
        mfaRequired: {type: boolean}
        mfaEnrolmentRequired: {type: boolean, description: ADMIN/BURSAR without MFA must enrol before continuing}
        mustChangePassword: {type: boolean}
        user: {$ref: '#/components/schemas/Me'}
    Me:
      type: object
      properties:
        id: {type: string, format: uuid}
        fullName: {type: string}
        roles: {type: array, items: {$ref: '#/components/schemas/Role'}}
        permissions: {type: array, items: {type: string}}
        csrfToken: {type: string}
        mfaEnabled: {type: boolean}
    StudentStatus: {type: string, enum: [applicant, active, withdrawn, transferred_out, alumni, deceased]}
    Gender: {type: string, enum: [male, female]}
    StudentSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        studentCode: {type: string, pattern: '^[A-Z]{3}-\d{2}-\d{5}-\d$', examples: [KSV-26-00417-7]}
        fullName: {type: string}
        preferredName: {type: string}
        className: {type: string}
        rollNumber: {type: integer}
        status: {$ref: '#/components/schemas/StudentStatus'}
        photoUrl: {type: string}
        hasMedicalAlert: {type: boolean}
    Student:
      allOf:
        - $ref: '#/components/schemas/StudentSummary'
        - type: object
          properties:
            firstName: {type: string}
            middleNames: {type: string}
            lastName: {type: string}
            dateOfBirth: {type: string, format: date}
            gender: {$ref: '#/components/schemas/Gender'}
            nationality: {type: string}
            homeAddress: {type: string, description: Field-restricted}
            previousSchool: {type: string}
            admissionDate: {type: string, format: date}
            admissionClassId: {type: string, format: uuid}
            currentEnrolment: {$ref: '#/components/schemas/Enrolment'}
            birthCertNo: {type: string}
            religion: {type: string}
            languages: {type: array, items: {type: string}}
            balancePesewas: {$ref: '#/components/schemas/Pesewas'}
            version: {type: integer}
    AdmitStudentRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, dateOfBirth, gender, admissionDate, classId, guardians]
      properties:
        firstName: {type: string, maxLength: 80}
        middleNames: {type: string, maxLength: 120}
        lastName: {type: string, maxLength: 80}
        preferredName: {type: string, maxLength: 80}
        dateOfBirth: {type: string, format: date}
        gender: {$ref: '#/components/schemas/Gender'}
        nationality: {type: string, default: Ghanaian}
        homeAddress: {type: string, maxLength: 300}
        previousSchool: {type: string, maxLength: 150}
        admissionDate: {type: string, format: date}
        classId: {type: string, format: uuid}
        birthCertNo: {type: string, maxLength: 50}
        religion: {type: string, maxLength: 50}
        languages: {type: array, items: {type: string, maxLength: 40}, maxItems: 10}
        guardians:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              guardianId: {type: string, format: uuid, description: Link an existing guardian (siblings auto-link)}
              newGuardian: {$ref: '#/components/schemas/GuardianInput'}
              relationship: {type: string}
              isPrimary: {type: boolean}
              isFeePayer: {type: boolean}
              canPickUp: {type: boolean}
        medical: {$ref: '#/components/schemas/StudentMedicalInput'}
        emergencyContacts: {type: array, items: {$ref: '#/components/schemas/EmergencyContactInput'}}
        confirmNotDuplicate: {type: boolean}
        duplicateOverrideReason: {type: string, maxLength: 300}
    StudentMedicalInput:
      type: object
      additionalProperties: false
      properties:
        bloodGroup: {type: string, enum: [A+, A-, B+, B-, AB+, AB-, O+, O-, unknown]}
        allergies: {type: string, maxLength: 1000}
        chronicConditions: {type: string, maxLength: 1000}
        medicationNotes: {type: string, maxLength: 1000}
        specialNeeds: {type: string, maxLength: 1000}
        doctorName: {type: string}
        clinicName: {type: string}
        clinicPhone: {type: string}
        alertSummary: {type: string, maxLength: 200}
    StudentMedical:
      allOf: [{$ref: '#/components/schemas/StudentMedicalInput'}, {type: object, properties: {hasAlert: {type: boolean}, updatedAt: {type: string, format: date-time}}}]
    GuardianInput:
      type: object
      additionalProperties: false
      required: [firstName, lastName, phonePrimary]
      properties:
        title: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        phonePrimary: {type: string, description: 'Accepts 024..., stored +233...'}
        phoneSecondary: {type: string}
        whatsappNumber: {type: string}
        email: {type: string, format: email}
        occupation: {type: string}
        workplace: {type: string}
        homeAddress: {type: string}
        workAddress: {type: string}
        ghanaCardNumber: {type: string, pattern: '^GHA-\d{9}-\d$', description: Write-only; encrypted}
    Guardian:
      type: object
      properties:
        id: {type: string, format: uuid}
        fullName: {type: string}
        phonePrimary: {type: string}
        phoneSecondary: {type: string}
        whatsappNumber: {type: string}
        email: {type: string}
        occupation: {type: string}
        workplace: {type: string}
        homeAddress: {type: string}
        workAddress: {type: string}
        ghanaCardLast4: {type: string}
        children: {type: array, items: {$ref: '#/components/schemas/StudentSummary'}}
        version: {type: integer}
    EmergencyContactInput:
      type: object
      properties:
        priority: {type: integer, minimum: 1}
        guardianId: {type: string, format: uuid}
        name: {type: string}
        relationship: {type: string}
        phone: {type: string}
        notes: {type: string}
    EmergencyView:
      type: object
      properties:
        student: {$ref: '#/components/schemas/StudentSummary'}
        bloodGroup: {type: string}
        alertSummary: {type: string}
        allergies: {type: string, description: Shown here because it is safety-critical}
        contacts:
          type: array
          items: {type: object, properties: {priority: {type: integer}, name: {type: string}, relationship: {type: string}, phones: {type: array, items: {type: string}}, telLinks: {type: array, items: {type: string}}}}
        authorisedPickups: {type: array, items: {type: object}}
        doctor: {type: object, properties: {name: {type: string}, clinic: {type: string}, phone: {type: string}}}
        recentContactLog: {type: array, items: {type: object}}
    Enrolment:
      type: object
      properties:
        id: {type: string, format: uuid}
        classId: {type: string, format: uuid}
        className: {type: string}
        academicYear: {type: string}
        rollNumber: {type: integer}
        startDate: {type: string, format: date}
        endDate: {type: [string, 'null'], format: date}
        status: {type: string}
    PromotionRun:
      type: object
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [draft, committed, undone]}
        fromAcademicYearId: {type: string, format: uuid}
        toAcademicYearId: {type: string, format: uuid}
        arrearsPolicy: {type: string, enum: [off, warn, block]}
        undoDeadline: {type: [string, 'null'], format: date-time}
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              student: {$ref: '#/components/schemas/StudentSummary'}
              action: {type: string, enum: [promote, repeat, skip, withdraw, transfer_out, graduate]}
              targetClassId: {type: [string, 'null'], format: uuid}
              outstandingPesewas: {$ref: '#/components/schemas/Pesewas'}
              arrearsFlag: {type: boolean}
              overrideReason: {type: string}
    PaymentMethod: {type: string, enum: [cash, bank_transfer, cheque, momo_mtn, telecel_cash, at_money]}
    RecordPaymentRequest:
      type: object
      additionalProperties: false
      required: [studentId, amountPesewas, method, receivedAt]
      properties:
        studentId: {type: string, format: uuid}
        payerGuardianId: {type: string, format: uuid}
        payerName: {type: string, maxLength: 120}
        amountPesewas: {type: integer, minimum: 1}
        method: {$ref: '#/components/schemas/PaymentMethod'}
        referenceNo: {type: string, maxLength: 64, description: Required for every method except cash}
        bankName: {type: string}
        chequeNo: {type: string}
        receivedAt: {type: string, format: date-time}
        notes: {type: string, maxLength: 500}
        allocations:
          type: array
          description: Optional explicit allocation; otherwise automatic. Sum may be less than amount (rest = credit).
          items: {type: object, required: [invoiceLineId, amountPesewas], properties: {invoiceLineId: {type: string, format: uuid}, amountPesewas: {type: integer, minimum: 1}}}
        confirmDuplicate: {type: boolean}
        duplicateOverrideReason: {type: string, maxLength: 300}
    Payment:
      type: object
      properties:
        id: {type: string, format: uuid}
        receiptNo: {type: string, examples: [RCP-000413]}
        studentId: {type: string, format: uuid}
        amountPesewas: {$ref: '#/components/schemas/Pesewas'}
        method: {$ref: '#/components/schemas/PaymentMethod'}
        referenceNo: {type: string}
        status: {type: string, enum: [confirmed, reversed], description: 'v2 adds pending, failed'}
        source: {type: string, enum: [manual], description: 'v2 adds gateway'}
        externalReference: {type: [string, 'null'], description: Reserved for v2 gateway}
        receivedAt: {type: string, format: date-time}
        recordedBy: {type: string}
        allocations: {type: array, items: {type: object, properties: {invoiceLineId: {type: [string, 'null']}, feeItemName: {type: string}, amountPesewas: {$ref: '#/components/schemas/Pesewas'}}}}
        creditCreatedPesewas: {$ref: '#/components/schemas/Pesewas'}
        balanceAfterPesewas: {$ref: '#/components/schemas/Pesewas'}
        reversal: {type: [object, 'null'], properties: {reversedAt: {type: string}, reversedBy: {type: string}, reason: {type: string}, reversalNo: {type: string}}}
    GenerateInvoicesRequest:
      type: object
      additionalProperties: false
      required: [termId, scope]
      properties:
        termId: {type: string, format: uuid}
        scope: {type: object, properties: {type: {type: string, enum: [student, class, level, school]}, ids: {type: array, items: {type: string, format: uuid}}}}
        issueDate: {type: string, format: date}
        dueDate: {type: string, format: date}
        dryRun: {type: boolean, default: true}
    Invoice:
      type: object
      properties:
        id: {type: string, format: uuid}
        invoiceNo: {type: string}
        studentId: {type: string, format: uuid}
        termId: {type: string, format: uuid}
        status: {type: string, enum: [issued, void]}
        openingBalancePesewas: {$ref: '#/components/schemas/Pesewas'}
        totalPesewas: {$ref: '#/components/schemas/Pesewas'}
        paidPesewas: {$ref: '#/components/schemas/Pesewas'}
        adjustmentsPesewas: {$ref: '#/components/schemas/Pesewas'}
        outstandingPesewas: {$ref: '#/components/schemas/Pesewas'}
        lines: {type: array, items: {type: object, properties: {id: {type: string, format: uuid}, feeItemName: {type: string}, amountPesewas: {$ref: '#/components/schemas/Pesewas'}, paidPesewas: {$ref: '#/components/schemas/Pesewas'}}}}
    AdjustmentRequest:
      type: object
      additionalProperties: false
      required: [studentId, termId, type, reason]
      properties:
        studentId: {type: string, format: uuid}
        termId: {type: string, format: uuid}
        type: {type: string, enum: [discount, scholarship, bursary, sibling_discount, waiver, refund, write_off, manual_charge]}
        feeItemId: {type: string, format: uuid}
        amountPesewas: {type: integer, minimum: 1}
        percentBasisPoints: {type: integer, minimum: 1, maximum: 10000, description: Alternative to amount; 2500 = 25%}
        reason: {type: string, minLength: 5, maxLength: 500}
    Balance:
      type: object
      properties:
        studentId: {type: string, format: uuid}
        balancePesewas: {$ref: '#/components/schemas/Pesewas', description: Positive = owes; negative = credit}
        currentTermOutstandingPesewas: {$ref: '#/components/schemas/Pesewas'}
        arrearsPesewas: {$ref: '#/components/schemas/Pesewas'}
        creditPesewas: {$ref: '#/components/schemas/Pesewas'}
        lastPaymentAt: {type: [string, 'null'], format: date-time}
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [kind, channel, audience]
      properties:
        kind: {type: string, enum: [fee_reminder, absence_alert, announcement, closure_notice, emergency]}
        channel: {type: string, enum: [sms, whatsapp]}
        templateId: {type: string, format: uuid}
        body: {type: string, maxLength: 640}
        audience: {type: object, properties: {type: {type: string, enum: [students, guardians, class, level, school, defaulters]}, ids: {type: array, items: {type: string, format: uuid}}, primaryGuardianOnly: {type: boolean, default: true}}}
        scheduledFor: {type: string, format: date-time}
    SearchResults:
      type: object
      properties:
        students: {type: array, items: {$ref: '#/components/schemas/StudentSummary'}}
        guardians: {type: array, items: {type: object, properties: {id: {type: string}, fullName: {type: string}, phone: {type: string}, childrenCount: {type: integer}}}}
        staff: {type: array, items: {type: object, properties: {id: {type: string}, fullName: {type: string}, jobTitle: {type: string}}}}
        receipts: {type: array, items: {type: object, properties: {paymentId: {type: string}, receiptNo: {type: string}, studentName: {type: string}, amountPesewas: {$ref: '#/components/schemas/Pesewas'}}}}
