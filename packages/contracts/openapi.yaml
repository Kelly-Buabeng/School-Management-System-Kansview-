    parameters: [{$ref: '#/components/parameters/Id'}]
    get: {tags: [finance], operationId: getPayment, x-permission: 'payments:read', responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}}}
