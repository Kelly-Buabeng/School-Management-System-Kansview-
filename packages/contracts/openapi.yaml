  /payments:
    get: {tags: [finance], operationId: listPayments, x-permission: 'payments:read', parameters: [{name: from, in: query, schema: {type: string, format: date}}, {name: to, in: query, schema: {type: string, format: date}}, {name: method, in: query, schema: {$ref: '#/components/schemas/PaymentMethod'}}, {name: studentId, in: query, schema: {type: string, format: uuid}}, {name: idempotencyKey, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Page'}], responses: {'200': {description: OK}}}
    post:
      tags: [finance]
      operationId: recordPayment
      x-permission: 'payments:create'
      x-audit: create
      x-idempotent: true
      summary: |
        Manual payment entry by the bursar. One transaction: payment + receipt number + allocations + ledger entries.
        Default allocation is oldest-outstanding-first by fee item priority; explicit allocations allowed.
        Any excess becomes credit (unallocated). Returns 409 PAYMENT_DUPLICATE_REFERENCE if method+reference already exists,
        unless `confirmDuplicate: true` with `duplicateOverrideReason`.
        Replaying the same Idempotency-Key with the same body returns the original 201; a different body returns 422.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecordPaymentRequest'}}}}
      responses:
        '201': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
